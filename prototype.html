<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Experience | FoundryIQ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b11f4b'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='18' font-weight='700' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    body[data-palette="rose"] { --brand: var(--cp-accent); --brand-soft: var(--cp-accent-soft); --wash: color-mix(in srgb, var(--cp-accent) 13%, var(--cp-bg)); --mock-bg: color-mix(in srgb, var(--cp-accent) 18%, var(--cp-bg)); }
    body[data-palette="blue"] { --brand: var(--cp-link); --brand-soft: var(--cp-highlight); --wash: color-mix(in srgb, var(--cp-link) 15%, var(--cp-bg)); --mock-bg: color-mix(in srgb, var(--cp-link) 20%, var(--cp-bg)); }
    body[data-palette="green"] { --brand: var(--cp-success); --brand-soft: var(--cp-highlight); --wash: color-mix(in srgb, var(--cp-success) 16%, var(--cp-bg)); --mock-bg: color-mix(in srgb, var(--cp-success) 22%, var(--cp-bg)); }
    body[data-palette="amber"] { --brand: var(--cp-warning); --brand-soft: var(--cp-accent-soft); --wash: color-mix(in srgb, var(--cp-warning) 18%, var(--cp-bg)); --mock-bg: color-mix(in srgb, var(--cp-warning) 23%, var(--cp-bg)); }
    body[data-type="agent"] {
      --cp-bg: var(--mock-bg);
      --cp-bg-elevated: color-mix(in srgb, var(--brand) 12%, var(--cp-surface));
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 4%, var(--brand-soft), transparent 30rem),
        linear-gradient(135deg, var(--wash), var(--cp-bg) 42%, var(--cp-bg-elevated));
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    .app { width: min(1200px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 44px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
    .brand strong { display: block; font-size: 1.25rem; letter-spacing: -0.04em; }
    .brand span, .muted { color: var(--cp-text-muted); }
    .badge {
      border: 1px solid var(--cp-border);
      background: var(--brand-soft);
      color: var(--cp-text);
      padding: 7px 10px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.82rem;
    }
    .btn {
      border: 1px solid var(--brand);
      background: var(--brand);
      color: var(--cp-accent-fg);
      border-radius: 0.625rem;
      padding: 10px 13px;
      text-decoration: none;
      display: inline-flex;
      font-weight: 800;
      justify-content: center;
    }
    .ghost {
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
      color: var(--cp-text);
      border-radius: 0.625rem;
      padding: 10px 13px;
    }
    .hero {
      background: linear-gradient(135deg, var(--cp-surface), var(--wash));
      border: 1px solid var(--cp-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--cp-shadow);
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 4.5vw, 3.6rem); line-height: 0.98; letter-spacing: -0.075em; }
    h2, h3 { letter-spacing: -0.04em; }
    .lead { margin: 0; color: var(--cp-text-muted); line-height: 1.55; max-width: 82ch; font-size: 1.05rem; }
    .grid { display: grid; gap: 16px; }
    .web-grid { grid-template-columns: 1fr 360px; }
    .agent-grid { grid-template-columns: 0.95fr 1.05fr; }
    .card {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
    }
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .product {
      background: var(--cp-surface-soft);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .product-art {
      height: 108px;
      border-radius: 14px;
      background: var(--brand-soft);
      display: grid;
      place-items: center;
      font-size: 2rem;
      border: 1px solid var(--cp-border);
    }
    .commerce-hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      background: var(--brand-soft);
      border: 1px solid var(--cp-border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .commerce-hero strong { display: block; font-size: 1.25rem; letter-spacing: -0.04em; margin-bottom: 5px; }
    .commerce-hero span { color: var(--cp-text-muted); }
    .price { color: var(--brand); font-size: 1.2rem; font-weight: 900; }
    .cart-line, .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--cp-border);
      padding: 10px 0;
    }
    .cart-line:last-child, .row:last-child { border-bottom: 0; }
    .pay-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .pay-methods button.active, .slot.active, .doctor.active, .quick.active {
      border-color: var(--brand);
      background: var(--brand-soft);
      font-weight: 800;
    }
    .checkout { margin-top: 12px; padding: 12px; border-radius: 16px; background: var(--cp-accent-soft); color: var(--cp-text-muted); }
    .phone-wrap { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .phone {
      width: 330px;
      max-width: 100%;
      margin: 0 auto;
      border: 1px solid var(--cp-border-strong);
      border-radius: 38px;
      background: var(--cp-surface);
      padding: 16px 13px;
      box-shadow: var(--cp-shadow);
    }
    .phone-screen { min-height: 690px; border-radius: 28px; background: linear-gradient(180deg, var(--wash), var(--cp-bg-elevated)); border: 1px solid var(--cp-border); padding: 15px; }
    .mobile-card, .doctor, .slot {
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      text-align: left;
    }
    .mobile-card strong, .doctor strong, .slot strong { display: block; margin-bottom: 4px; }
    .mobile-card span, .doctor span, .slot span { color: var(--cp-text-muted); font-size: 0.86rem; }
    .specialties { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .confirm { padding: 12px; background: var(--brand-soft); border: 1px solid var(--cp-border); border-radius: 16px; color: var(--cp-text-muted); }
    .calendar-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 10px 0 14px;
    }
    .day {
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
      border-radius: 14px;
      padding: 9px 4px;
      text-align: center;
      font-size: 0.82rem;
    }
    .day.active { border-color: var(--brand); background: var(--brand-soft); font-weight: 800; }
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .navpill { text-align: center; color: var(--cp-text-muted); font-size: 0.78rem; padding: 8px 4px; border-radius: 999px; background: var(--cp-surface); border: 1px solid var(--cp-border); }
    .navpill.active { color: var(--cp-text); background: var(--brand-soft); border-color: var(--brand); }
    .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .dashboard-shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
    }
    .report-side {
      background: var(--cp-surface-soft);
      border: 1px solid var(--cp-border);
      border-radius: 18px;
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .side-item {
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
      border-radius: 14px;
      padding: 11px;
    }
    .side-item strong { display: block; color: var(--brand); margin-bottom: 3px; }
    .viz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .viz {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      padding: 14px;
    }
    .viz h3 { margin-top: 0; }
    .spark {
      height: 110px;
      display: flex;
      align-items: end;
      gap: 8px;
      padding-top: 10px;
    }
    .spark span {
      flex: 1;
      min-width: 16px;
      height: var(--h);
      border-radius: 8px 8px 3px 3px;
      background: var(--brand);
      opacity: var(--o);
    }
    .donut {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      margin: 8px auto;
      background: conic-gradient(var(--brand) 0 62%, var(--cp-surface-soft) 62% 100%);
      display: grid;
      place-items: center;
      border: 1px solid var(--cp-border);
    }
    .donut strong {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--cp-surface);
      color: var(--brand);
      font-size: 1.3rem;
    }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .kpi { background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 16px; padding: 13px; }
    .kpi strong { display: block; color: var(--brand); font-size: 1.55rem; letter-spacing: -0.06em; }
    .bar { height: 10px; border-radius: 999px; background: var(--cp-surface-soft); overflow: hidden; margin-top: 8px; }
    .bar span { display: block; height: 100%; width: var(--v); background: var(--brand); }
    .chat {
      min-height: 570px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 24px;
      box-shadow: var(--cp-shadow);
      overflow: hidden;
    }
    .chat-head, .chat-input { padding: 16px; background: var(--cp-surface-soft); border-bottom: 1px solid var(--cp-border); }
    .chat-input { border-bottom: 0; border-top: 1px solid var(--cp-border); display: grid; gap: 10px; }
    .chat-compose { display: flex; gap: 10px; }
    .chat-compose input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
      color: var(--cp-text);
      border-radius: 0.625rem;
      padding: 10px 12px;
    }
    .messages { padding: 18px; display: grid; gap: 12px; align-content: start; overflow: auto; }
    .msg { max-width: 82%; border: 1px solid var(--cp-border); background: var(--cp-surface-soft); border-radius: 18px; padding: 12px 14px; color: var(--cp-text-muted); line-height: 1.4; }
    .msg.agent { margin-left: auto; background: var(--brand-soft); color: var(--cp-text); border-color: var(--cp-border-strong); }
    .quickbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .report-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .report-tab {
      border: 1px solid var(--cp-border);
      background: var(--cp-surface-soft);
      color: var(--cp-text-muted);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 0.88rem;
    }
    .report-tab.active { border-color: var(--brand); background: var(--brand-soft); color: var(--cp-text); font-weight: 800; }
    @media (max-width: 960px) {
      .web-grid, .phone-wrap, .agent-grid, .report-grid, .dashboard-shell, .viz-grid { grid-template-columns: 1fr; }
      .products, .kpis { grid-template-columns: 1fr; }
      .top { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div class="brand"><strong id="appName">Generated Experience</strong><span>Built from business intent with FoundryIQ + GitHub Copilot</span></div>
      <div><span class="badge" id="badge">Ready</span></div>
    </div>
    <section class="hero">
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </section>
    <section id="render"></section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    let type = params.get("type") || "web";
    const scenario = params.get("scenario") || "";
    if (scenario === "commerce") type = "web";
    if (scenario === "health") type = "mobile";
    if (scenario === "report") type = "agent";
    const palette = params.get("palette") || "rose";
    document.body.dataset.palette = palette;
    document.body.dataset.type = type;

    const copy = {
      web: {
        name: "Storefront Copilot Commerce",
        badge: "Web ecommerce generated",
        title: "Una tienda lista para vender, con carrito y medios de pago.",
        lead: "Ejemplo de vibe coding: a partir de una idea de negocio se genera una web interactiva con catálogo, carrito, checkout y recomendaciones."
      },
      mobile: {
        name: "Medical Appointments Mobile",
        badge: "Mobile app generated",
        title: "Una app mobile para reservar turnos médicos.",
        lead: "La experiencia permite elegir especialidad, profesional, horario y confirmar el turno con recordatorio y cobertura."
      },
      agent: {
        name: "Report Intelligence Agent",
        badge: "Conversational agent generated",
        title: "Un agente que conversa con Power BI y contrasta con SharePoint.",
        lead: "El agente responde sobre métricas del reporte, explica variaciones y cruza hallazgos con minutas y documentos internos."
      }
    };

    const current = copy[type] || copy.web;
    document.title = `${current.name} | FoundryIQ`;
    document.getElementById("appName").textContent = current.name;
    document.getElementById("badge").textContent = current.badge;
    document.getElementById("title").textContent = current.title;
    document.getElementById("lead").textContent = current.lead;

    function renderCommerce() {
      return `<div class="grid web-grid">
        <div class="card">
          <div class="commerce-hero"><div><strong>AI Storefront</strong><span>La experiencia generada incluye catálogo, recomendación, carrito y checkout. Cada acción deja un evento para CRM.</span></div><span class="badge">Live preview</span></div>
          <h2>Productos destacados</h2>
          <div class="products" id="products"></div>
        </div>
        <aside class="card">
          <h2>Carrito</h2>
          <div id="cart"></div>
          <h3>Medio de pago</h3>
          <div class="pay-methods">
            <button class="ghost active" data-pay="Tarjeta">Tarjeta</button>
            <button class="ghost" data-pay="Transferencia">Transferencia</button>
            <button class="ghost" data-pay="Wallet">Wallet</button>
            <button class="ghost" data-pay="Pago en tienda">Pago en tienda</button>
          </div>
          <button class="btn" id="checkout" type="button">Confirmar compra</button>
          <div class="checkout" id="checkoutMsg">Seleccioná productos para simular el checkout.</div>
          <div class="checkout"><strong>Copilot insight</strong><br><span id="commerceInsight">Agregá productos y el agente sugerirá bundle, descuento o próximo paso comercial.</span></div>
          <a class="ghost" href="index.html#vibe" style="margin-top:12px;text-decoration:none;display:inline-flex">Volver</a>
        </aside>
      </div>`;
    }
    function mountCommerce() {
      const products = [
        ["Notebook Surface Pro", "Equipo premium para productividad ejecutiva", 1890, "💻"],
        ["Headset Teams Certified", "Audio profesional para reuniones híbridas", 210, "🎧"],
        ["Security Key", "Acceso seguro para usuarios corporativos", 85, "🔐"],
        ["Docking Station", "Puesto de trabajo listo para oficina", 320, "🖥️"],
        ["Copilot Workshop", "Sesión de adopción para equipos de negocio", 950, "🧠"],
        ["AI Readiness Pack", "Diagnóstico rápido de procesos candidatos", 1200, "🧩"]
      ];
      const cart = [];
      const productEl = document.getElementById("products");
      const cartEl = document.getElementById("cart");
      let pay = "Tarjeta";
      function drawCart() {
        const total = cart.reduce((sum, item) => sum + item[2], 0);
        cartEl.innerHTML = cart.length ? cart.map(item => `<div class="cart-line"><span>${item[0]}</span><strong>USD ${item[2]}</strong></div>`).join("") + `<div class="cart-line"><strong>Total</strong><strong class="price">USD ${total}</strong></div>` : `<p class="muted">El carrito está vacío.</p>`;
        const insight = document.getElementById("commerceInsight");
        if (insight) {
          insight.textContent = cart.length >= 2
            ? "Bundle detectado: sugerir workshop de adopción + hardware para acelerar cierre consultivo."
            : cart.length === 1
              ? "Producto seleccionado: el agente puede recomendar complemento y medio de pago preferido."
              : "Agregá productos y el agente sugerirá bundle, descuento o próximo paso comercial.";
        }
      }
      productEl.innerHTML = products.map((p, i) => `<article class="product"><div class="product-art">${p[3]}</div><strong>${p[0]}</strong><span class="muted">${p[1]}</span><span class="price">USD ${p[2]}</span><button class="btn" data-add="${i}" type="button">Agregar</button></article>`).join("");
      productEl.querySelectorAll("[data-add]").forEach(btn => btn.addEventListener("click", () => { cart.push(products[Number(btn.dataset.add)]); drawCart(); }));
      document.querySelectorAll("[data-pay]").forEach(btn => btn.addEventListener("click", () => { pay = btn.dataset.pay; document.querySelectorAll("[data-pay]").forEach(b => b.classList.toggle("active", b === btn)); }));
      document.getElementById("checkout").addEventListener("click", () => {
        const total = cart.reduce((sum, item) => sum + item[2], 0);
        document.getElementById("checkoutMsg").textContent = cart.length ? `Orden preparada por USD ${total} con ${pay}. El agente puede enviar confirmación y actualizar CRM.` : "Agregá al menos un producto para confirmar.";
      });
      drawCart();
    }

    function renderMobile() {
      return `<div class="phone-wrap">
        <div class="phone"><div class="phone-screen">
          <div class="mobile-card"><strong>Centro Médico Norte</strong><span>Turnos disponibles hoy y mañana</span></div>
          <div class="mobile-card"><strong>Paciente</strong><span>Daniela Díaz · OSDE 310 · cobertura verificada</span></div>
          <h3>Especialidad</h3>
          <div class="specialties">
            <button class="ghost active" data-specialty="Cardiología">Cardiología</button>
            <button class="ghost" data-specialty="Pediatría">Pediatría</button>
            <button class="ghost" data-specialty="Dermatología">Dermatología</button>
            <button class="ghost" data-specialty="Clínica médica">Clínica médica</button>
          </div>
          <h3>Día</h3>
          <div class="calendar-strip">
            <button class="day active" data-day="Hoy">Hoy<br>08</button>
            <button class="day" data-day="Mié">Mié<br>09</button>
            <button class="day" data-day="Jue">Jue<br>10</button>
            <button class="day" data-day="Vie">Vie<br>11</button>
          </div>
          <h3>Profesional</h3>
          <div id="doctorList"></div>
          <h3>Horario</h3>
          <div id="slotList"></div>
          <button class="btn" id="book" type="button">Confirmar turno</button>
          <div class="bottom-nav"><div class="navpill active">Turnos</div><div class="navpill">Recetas</div><div class="navpill">Estudios</div></div>
        </div></div>
        <div class="card">
          <h2>Estado de reserva</h2>
          <div class="confirm" id="booking">Seleccioná especialidad, médico y horario para confirmar.</div>
          <h3>Qué generó vibe coding</h3>
          <div class="flow">
            <div class="step"><strong>UX mobile</strong><span>Flujo de reserva orientado a paciente.</span></div>
            <div class="step"><strong>Reglas</strong><span>Validación de cobertura, disponibilidad y recordatorio.</span></div>
            <div class="step"><strong>Agente</strong><span>Puede sugerir alternativas si no hay turno.</span></div>
            <div class="step"><strong>Back office</strong><span>Actualiza agenda, prepaga y notificaciones.</span></div>
          </div>
          <a class="ghost" href="index.html#vibe" style="margin-top:12px;text-decoration:none;display:inline-flex">Volver</a>
        </div>
      </div>`;
    }
    function mountMobile() {
      let specialty = "Cardiología";
      let day = "Hoy";
      const schedule = {
        "Cardiología": [
          ["Dra. Valentina Luna", "Cardióloga clínica · Consultorio 4", ["Hoy 16:30", "Hoy 18:00", "Mié 09:30"]],
          ["Dr. Mateo Rivas", "Arritmias · Teleconsulta disponible", ["Mañana 10:00", "Jue 12:15"]]
        ],
        "Pediatría": [
          ["Dra. Emilia Paz", "Pediatría general · Vacunas", ["Hoy 15:00", "Mié 11:00"]],
          ["Dr. Bruno Salas", "Control niño sano", ["Jue 09:45", "Vie 14:20"]]
        ],
        "Dermatología": [
          ["Dra. Clara Méndez", "Dermatología clínica", ["Mié 16:10", "Jue 10:30"]],
          ["Dr. Mateo Rivas", "Dermatoscopía · Consultorio 2", ["Mañana 10:00", "Vie 12:40"]]
        ],
        "Clínica médica": [
          ["Dr. Julián Ferro", "Control general", ["Hoy 17:20", "Mié 08:40"]],
          ["Dra. Sofía Vidal", "Seguimiento crónicos", ["Jue 11:15", "Vie 09:10"]]
        ]
      };
      let doctor = schedule[specialty][0][0];
      let slot = schedule[specialty][0][2][0];
      const doctorList = document.getElementById("doctorList");
      const slotList = document.getElementById("slotList");
      function renderDoctors() {
        doctorList.innerHTML = schedule[specialty].map((item, index) => `<button class="doctor ${index === 0 ? "active" : ""}" data-doctor="${item[0]}" type="button"><strong>${item[0]}</strong><span>${item[1]}</span></button>`).join("");
        doctor = schedule[specialty][0][0];
        renderSlots();
        doctorList.querySelectorAll("[data-doctor]").forEach(btn => btn.addEventListener("click", () => {
          doctor = btn.dataset.doctor;
          doctorList.querySelectorAll("[data-doctor]").forEach(b => b.classList.toggle("active", b === btn));
          renderSlots();
        }));
      }
      function renderSlots() {
        const selected = schedule[specialty].find(item => item[0] === doctor) || schedule[specialty][0];
        slot = selected[2][0];
        slotList.innerHTML = selected[2].map((time, index) => `<button class="slot ${index === 0 ? "active" : ""}" data-slot="${time}" type="button"><strong>${time}</strong><span>${index === 0 ? "Primer disponible" : "Alternativa"} · Cobertura verificada</span></button>`).join("");
        slotList.querySelectorAll("[data-slot]").forEach(btn => btn.addEventListener("click", () => {
          slot = btn.dataset.slot;
          slotList.querySelectorAll("[data-slot]").forEach(b => b.classList.toggle("active", b === btn));
        }));
      }
      document.querySelectorAll("[data-specialty]").forEach(btn => btn.addEventListener("click", () => {
        specialty = btn.dataset.specialty;
        document.querySelectorAll("[data-specialty]").forEach(b => b.classList.toggle("active", b === btn));
        renderDoctors();
      }));
      document.querySelectorAll("[data-day]").forEach(btn => btn.addEventListener("click", () => { day = btn.dataset.day; document.querySelectorAll("[data-day]").forEach(b => b.classList.toggle("active", b === btn)); }));
      document.getElementById("book").addEventListener("click", () => {
        document.getElementById("booking").textContent = `Turno confirmado: ${specialty} con ${doctor}, ${day} · ${slot}. Se envía recordatorio, se valida cobertura y se actualiza agenda del centro médico.`;
      });
      renderDoctors();
    }

    function renderAgent() {
      return `<div class="grid agent-grid">
        <div class="card">
          <div class="dashboard-shell">
            <aside class="report-side">
              <span class="badge">Power BI report</span>
              <div class="side-item"><strong>Dataset</strong><span>Ventas corporativas · Q3</span></div>
              <div class="side-item"><strong>Filtro</strong><span id="reportFilter">Argentina · Región Sur</span></div>
              <div class="side-item"><strong>Actualizado</strong><span>hace 12 minutos</span></div>
              <span class="badge">SharePoint</span>
              <div id="sourceContext">
                <div class="side-item"><strong>Minuta comercial</strong><span>Promociones agresivas</span></div>
                <div class="side-item"><strong>Política Q3</strong><span>Descuentos excepcionales</span></div>
              </div>
            </aside>
            <section>
              <h2 id="reportHeading">Sales & Margin Command Center</h2>
              <div class="report-tabs">
                <button class="report-tab active" data-report="margin" type="button">Margen</button>
                <button class="report-tab" data-report="sales" type="button">Ventas</button>
                <button class="report-tab" data-report="discounts" type="button">Descuentos</button>
                <button class="report-tab" data-report="south" type="button">Región Sur</button>
              </div>
              <div class="kpis" id="reportKpis"></div>
              <div class="viz-grid">
                <div class="viz"><h3 id="sparkTitle">Ventas por semana</h3><div class="spark" id="sparkBars"></div></div>
                <div class="viz"><h3 id="donutTitle">Margen saludable</h3><div class="donut" id="donut"><strong id="donutValue">62%</strong></div></div>
              </div>
              <div id="reportRows"></div>
            </section>
          </div>
        </div>
        <div class="chat">
          <div class="chat-head"><strong>Report Intelligence Agent</strong><br><span class="badge">Power BI + SharePoint con fuentes</span></div>
          <div class="messages" id="messages">
            <div class="msg">¿Por qué cayó el margen si las ventas subieron?</div>
            <div class="msg agent">El reporte muestra +12% en ventas, pero SharePoint indica promociones agresivas en Región Sur. La hipótesis más fuerte es crecimiento impulsado por descuento, no por demanda orgánica.</div>
          </div>
          <div class="chat-input">
            <div class="quickbar"><button class="ghost quick" data-q="margin" type="button">Margen</button><button class="ghost quick" data-q="sales" type="button">Ventas</button><button class="ghost quick" data-q="discounts" type="button">Descuentos</button><button class="ghost quick" data-q="sources" type="button">Fuentes</button><button class="ghost quick" data-q="action" type="button">Acción</button><button class="ghost quick" data-q="risk" type="button">Riesgo</button></div>
            <div class="chat-compose"><input id="chatQuestion" aria-label="Pregunta para el agente" placeholder="Escribí una pregunta: margen, ventas, descuentos, región sur..." /><button class="btn" id="askAgent" type="button">Preguntar</button></div>
          </div>
        </div>
      </div>`;
    }
    function mountAgent() {
      const messages = document.getElementById("messages");
      const reportData = {
        margin: {
          heading: "Sales & Margin Command Center",
          filter: "Argentina · Todas las regiones",
          kpis: [["+12%", "ventas vs mes anterior"], ["-4.8", "puntos de margen"], ["37%", "ventas con descuento"]],
          spark: [42, 58, 64, 80, 92],
          sparkTitle: "Ventas por semana",
          donutTitle: "Margen saludable",
          donut: "62%",
          sources: [["Minuta comercial", "Promociones agresivas"], ["Política Q3", "Descuentos excepcionales"]],
          rows: [["Región Norte", "Ventas y margen saludables", 82], ["Región Centro", "Crecimiento moderado", 64], ["Región Sur", "Ventas altas con margen bajo", 43]]
        },
        sales: {
          heading: "Sales Growth View",
          filter: "Argentina · Ventas netas",
          kpis: [["USD 4.8M", "ventas del mes"], ["+12%", "crecimiento mensual"], ["68%", "pipeline convertido"]],
          spark: [38, 44, 57, 76, 88],
          sparkTitle: "Ventas acumuladas",
          donutTitle: "Conversión pipeline",
          donut: "68%",
          sources: [["Forecast comercial", "Oportunidades cerradas"], ["Campaña Q3", "Mayor conversión en Sur"]],
          rows: [["Enterprise", "Mayor volumen de venta", 91], ["Mid-market", "Crecimiento estable", 72], ["SMB", "Baja contribución", 38]]
        },
        discounts: {
          heading: "Discount Pressure View",
          filter: "Argentina · Promociones Q3",
          kpis: [["37%", "ventas con descuento"], ["-9.2%", "precio promedio"], ["14", "excepciones activas"]],
          spark: [22, 31, 46, 67, 86],
          sparkTitle: "Uso de descuentos",
          donutTitle: "Excepciones aprobadas",
          donut: "74%",
          sources: [["Política de descuentos Q3", "Excepciones para cuentas estratégicas"], ["Minuta comité comercial", "Extensión de promociones"]],
          rows: [["Descuento estándar", "Dentro de política", 58], ["Descuento especial", "Requiere justificación", 74], ["Excepción ejecutiva", "Impacta margen", 86]]
        },
        south: {
          heading: "Región Sur Deep Dive",
          filter: "Argentina · Región Sur",
          kpis: [["+18%", "ventas en Sur"], ["-7.1", "puntos de margen"], ["42%", "órdenes express"]],
          spark: [48, 52, 66, 84, 96],
          sparkTitle: "Ventas Región Sur",
          donutTitle: "Salud de margen Sur",
          donut: "43%",
          sources: [["Plan de logística", "Incremento entregas express"], ["Minuta comercial", "Promoción extendida en Sur"]],
          rows: [["Buenos Aires", "Ventas altas con descuento", 48], ["Córdoba", "Crecimiento sano", 67], ["Patagonia", "Logística presiona margen", 39]]
        }
      };
      const answers = {
        margin: ["Explicame el margen.", "Power BI muestra que el margen cae 4.8 puntos mientras las ventas suben. Al contrastarlo con SharePoint, las causas más probables son descuentos excepcionales y mayor costo de entregas express en Región Sur."],
        sales: ["¿Las ventas están bien?", "Sí, las ventas crecen 12% y el pipeline convertido llega a 68%. El punto a mirar es calidad de venta: parte del crecimiento viene con más descuento y menor margen."],
        discounts: ["¿Qué pasa con descuentos?", "El 37% de las ventas tiene descuento y hay 14 excepciones activas. SharePoint confirma que Q3 habilitó descuentos para cuentas estratégicas; conviene separar ventas orgánicas de ventas subsidiadas."],
        sources: ["Mostrame las fuentes.", "Fuentes usadas: Power BI margen por región, forecast comercial, minuta de comité comercial, política de descuentos Q3 y plan de logística en SharePoint."],
        action: ["¿Qué acción recomendamos?", "Acción recomendada: pausar extensión de promociones en Región Sur, separar ventas con descuento de ventas orgánicas, revisar logística express y presentar ajuste en comité comercial."],
        risk: ["¿Cuál es el riesgo?", "Riesgo principal: celebrar crecimiento de ventas que en realidad está comprando volumen con margen. Si continúa, el trimestre puede cerrar con ingresos altos pero rentabilidad por debajo del objetivo."]
      };
      function renderReport(view) {
        const data = reportData[view];
        document.getElementById("reportHeading").textContent = data.heading;
        document.getElementById("reportFilter").textContent = data.filter;
        document.getElementById("reportKpis").innerHTML = data.kpis.map(item => `<div class="kpi"><strong>${item[0]}</strong><span>${item[1]}</span></div>`).join("");
        document.getElementById("sparkTitle").textContent = data.sparkTitle;
        document.getElementById("sparkBars").innerHTML = data.spark.map((value, index) => `<span style="--h:${value}%;--o:${0.45 + index * 0.13}"></span>`).join("");
        document.getElementById("donutTitle").textContent = data.donutTitle;
        document.getElementById("donutValue").textContent = data.donut;
        document.getElementById("sourceContext").innerHTML = data.sources.map(item => `<div class="side-item"><strong>${item[0]}</strong><span>${item[1]}</span></div>`).join("");
        document.getElementById("reportRows").innerHTML = data.rows.map(row => `<div class="row"><div><strong>${row[0]}</strong><span>${row[1]}</span><div class="bar"><span style="--v:${row[2]}%"></span></div></div><strong>${row[2]}</strong></div>`).join("");
        document.querySelectorAll("[data-report]").forEach(tab => tab.classList.toggle("active", tab.dataset.report === view));
      }
      function ask(key, customQuestion) {
        const pair = answers[key] || answers.margin;
        const question = customQuestion || pair[0];
        messages.insertAdjacentHTML("beforeend", `<div class="msg">${question}</div><div class="msg agent">${pair[1]}</div>`);
        messages.scrollTop = messages.scrollHeight;
      }
      document.querySelectorAll("[data-report]").forEach(tab => tab.addEventListener("click", () => {
        renderReport(tab.dataset.report);
        ask(tab.dataset.report, `Analizá la vista ${tab.textContent}.`);
      }));
      document.querySelectorAll("[data-q]").forEach(btn => btn.addEventListener("click", () => ask(btn.dataset.q)));
      document.getElementById("askAgent").addEventListener("click", () => {
        const input = document.getElementById("chatQuestion");
        const text = input.value.trim();
        const lower = text.toLowerCase();
        const key = lower.includes("venta") ? "sales" : lower.includes("descuento") || lower.includes("promo") ? "discounts" : lower.includes("fuente") || lower.includes("sharepoint") ? "sources" : lower.includes("riesgo") ? "risk" : lower.includes("acción") || lower.includes("accion") || lower.includes("recomend") ? "action" : "margin";
        ask(key, text || "Explicame qué está pasando.");
        input.value = "";
      });
      document.getElementById("chatQuestion").addEventListener("keydown", (event) => {
        if (event.key === "Enter") document.getElementById("askAgent").click();
      });
      renderReport("margin");
    }

    const render = document.getElementById("render");
    if (type === "mobile") { render.innerHTML = renderMobile(); mountMobile(); }
    else if (type === "agent") { render.innerHTML = renderAgent(); mountAgent(); }
    else { render.innerHTML = renderCommerce(); mountCommerce(); }
  </script>
</body>
