<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Business App | FoundryIQ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b11f4b'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='18' font-weight='700' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .app { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0; }
    .top {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      margin-bottom: 22px;
    }
    .brand strong { display: block; font-size: 1.25rem; letter-spacing: -0.04em; }
    .brand span { color: var(--cp-text-muted); }
    .badge {
      border: 1px solid var(--cp-border);
      background: var(--cp-accent-soft);
      color: var(--cp-text);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .hero {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--cp-shadow);
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 4vw, 3.6rem); line-height: 1; letter-spacing: -0.075em; }
    .lead { margin: 0; max-width: 76ch; color: var(--cp-text-muted); line-height: 1.55; font-size: 1.06rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 0.85fr; gap: 16px; }
    .card {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
    }
    .card h2 { margin: 0 0 12px; font-size: 1.15rem; letter-spacing: -0.035em; }
    .item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--cp-border);
    }
    .item:last-child { border-bottom: 0; }
    .item span { color: var(--cp-text-muted); font-size: 0.9rem; }
    .score { color: var(--cp-accent); font-weight: 900; }
    .flow { display: grid; gap: 10px; }
    .step {
      border: 1px solid var(--cp-border);
      background: var(--cp-surface-soft);
      border-radius: 14px;
      padding: 12px;
    }
    .step strong { color: var(--cp-accent); display: block; margin-bottom: 4px; }
    .step span { color: var(--cp-text-muted); font-size: 0.9rem; }
    .action {
      display: inline-flex;
      border: 1px solid var(--cp-accent);
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      border-radius: 0.625rem;
      padding: 10px 13px;
      margin-top: 14px;
      text-decoration: none;
      font-weight: 700;
    }
    .footer-note { color: var(--cp-text-muted); margin-top: 18px; font-size: 0.9rem; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .top { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div class="brand"><strong id="appName">Generated Business App</strong><span>Created from business intent with Copilot + FoundryIQ patterns</span></div>
      <span class="badge">Prototype ready</span>
    </div>
    <section class="hero">
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </section>
    <section class="grid">
      <article class="card"><h2 id="signalTitle"></h2><div id="signals"></div></article>
      <article class="card"><h2>Agent recommendation</h2><div id="recommendation"></div></article>
      <article class="card"><h2>Process flow</h2><div class="flow" id="flow"></div><a class="action" href="index.html#vibe">Volver a la demo</a></article>
    </section>
    <div class="footer-note">Este prototipo ilustra cómo una necesidad de negocio puede convertirse en una experiencia de trabajo accionable.</div>
  </main>
  <script>
    const APPS = {
      retention: {
        name: "Customer Retention Desk",
        title: "Priorizar cuentas con riesgo antes de que sea tarde.",
        lead: "La app combina señales de soporte, actividad comercial y compromisos abiertos para sugerir una próxima acción con contexto.",
        signalTitle: "Accounts at risk",
        signals: [["Northwind Bank", "Riesgo 82"], ["Fabrikam Retail", "Riesgo 76"], ["Contoso Health", "Riesgo 68"]],
        recommendation: ["Contactar sponsor ejecutivo", "Preparar resumen de valor", "Revisar ticket crítico abierto"],
        flow: [["Detecta", "Baja interacción + ticket crítico"], ["Razona", "Cruza contrato, reuniones y soporte"], ["Propone", "Plan de retención"], ["Escala", "Aprobación del account owner"]]
      },
      sla: {
        name: "SLA Recovery Console",
        title: "Recuperar SLA operativo con acciones concretas.",
        lead: "La app identifica cuellos de botella, agrupa causas y sugiere acciones para volver al objetivo de servicio.",
        signalTitle: "Queues under pressure",
        signals: [["Compras indirectas", "SLA 71%"], ["Alta proveedores", "SLA 78%"], ["Validación legal", "SLA 83%"]],
        recommendation: ["Reasignar cola crítica", "Pausar casos de bajo impacto", "Notificar responsable operativo"],
        flow: [["Detecta", "SLA bajo umbral"], ["Agrupa", "Causas y responsables"], ["Propone", "Rebalanceo de trabajo"], ["Escala", "Gerente si impacto es alto"]]
      },
      invoice: {
        name: "Invoice Exception Hub",
        title: "Resolver excepciones de facturas con trazabilidad.",
        lead: "La app clasifica diferencias, recomienda resolución y deja evidencia para auditoría y aprobación.",
        signalTitle: "Exceptions detected",
        signals: [["Proveedor A-104", "Diferencia 8.4%"], ["Orden PO-8821", "Sin remito"], ["Factura 7742", "Precio fuera de contrato"]],
        recommendation: ["Solicitar evidencia", "Bloquear pago preventivo", "Enviar resumen a Finanzas"],
        flow: [["Detecta", "Excepción sobre umbral"], ["Valida", "Contrato, orden y remito"], ["Propone", "Resolver o escalar"], ["Registra", "Evidencia y decisión"]]
      }
    };
    const scenario = new URLSearchParams(location.search).get("scenario") || "retention";
    const app = APPS[scenario] || APPS.retention;
    document.getElementById("appName").textContent = app.name;
    document.getElementById("title").textContent = app.title;
    document.getElementById("lead").textContent = app.lead;
    document.getElementById("signalTitle").textContent = app.signalTitle;
    document.getElementById("signals").innerHTML = app.signals.map(([a,b]) => `<div class="item"><strong>${a}</strong><span class="score">${b}</span></div>`).join("");
    document.getElementById("recommendation").innerHTML = app.recommendation.map(x => `<div class="item"><strong>${x}</strong><span>Suggested</span></div>`).join("");
    document.getElementById("flow").innerHTML = app.flow.map(([a,b]) => `<div class="step"><strong>${a}</strong><span>${b}</span></div>`).join("");
  </script>
</body>
</html>
